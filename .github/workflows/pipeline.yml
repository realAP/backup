name: Pipeline

on:
  push:
    branches:
    - 'main'
    - 'dev'
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate test SSH keys
        run: bash tests/e2e/ssh/generate_test_keys.sh

      - name: Run E2E tests
        run: |
          set -o pipefail
          mkdir -p tests/e2e/logs
          bash tests/run_e2e.sh 2>&1 | tee tests/e2e/logs/full_output.log

      - name: Post logs as PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## E2E Test Failure Logs\n\n';
            try {
              const fullLog = fs.readFileSync('tests/e2e/logs/full_output.log', 'utf8');
              const lines = fullLog.split('\n');
              const last150 = lines.slice(-150).join('\n');
              body += '### Test Output (last 150 lines)\n```\n' + last150 + '\n```\n\n';
            } catch(e) { body += 'No full output log found.\n\n'; }
            try {
              const composeLog = fs.readFileSync('tests/e2e/logs/compose.log', 'utf8');
              body += '### Container Logs\n```\n' + composeLog.slice(-3000) + '\n```\n';
            } catch(e) { body += 'No compose logs found.\n'; }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 65000)
            });

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: tests/e2e/logs/

  publish-docker-image:
    needs: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: determine version
        run: |
          VERSION=$(cat VERSION | tr -d ' \t\n\r')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        if: contains('refs/heads/main', github.ref) || contains('refs/heads/dev', github.ref)
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push dev
        if: contains('refs/heads/dev', github.ref)
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          push: ${{ contains('refs/heads/main', github.ref) }}
          tags: ${{ vars.DOCKER_HUB_USERNAME }}/backup:dev
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push main
        if: contains('refs/heads/main', github.ref)
        uses: docker/build-push-action@v6
        with:
         context: ./docker
         push: true
         tags: ${{ vars.DOCKER_HUB_USERNAME }}/backup:latest, ${{ vars.DOCKER_HUB_USERNAME }}/backup:${{ env.VERSION }}
         platforms: linux/amd64,linux/arm/v7,linux/arm64
         cache-from: type=gha
         cache-to: type=gha,mode=max

  publish-dockerhub-description:
    if: contains('refs/heads/main', github.ref)
    needs:
      - publish-docker-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Dockerhub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          repository: ${{ vars.DOCKER_HUB_USERNAME }}/backup
          readme-filepath: ./README.md
