name: Pipeline

on:
  push:
    branches:
    - 'main'
    - 'dev'
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Run E2E tests
        run: |
          set -o pipefail
          mkdir -p tests/e2e/logs
          bash tests/run_e2e.sh 2>&1 | tee tests/e2e/logs/full_output.log

      - name: Post logs as PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## E2E Test Failure Logs\n\n';
            try {
              const fullLog = fs.readFileSync('tests/e2e/logs/full_output.log', 'utf8');
              const lines = fullLog.split('\n');
              // Find BATS output section
              const batsStart = lines.findIndex(l => l.includes('Running BATS tests'));
              const batsEnd = lines.findIndex(l => l.includes('tests finished with exit code'));
              if (batsStart >= 0 && batsEnd >= 0) {
                const batsLines = lines.slice(batsStart, batsEnd + 1).join('\n');
                body += '### BATS Test Output\n```\n' + batsLines.slice(0, 30000) + '\n```\n\n';
              }
              // Also show smoke test
              const smokeStart = lines.findIndex(l => l.includes('Smoke test'));
              const smokeEnd = lines.findIndex(l => l.includes('Running BATS'));
              if (smokeStart >= 0 && smokeEnd >= 0) {
                const smokeLines = lines.slice(smokeStart, smokeEnd).join('\n');
                body += '### Smoke Test Output\n```\n' + smokeLines.slice(0, 10000) + '\n```\n\n';
              }
              // Debug section
              const debugStart = lines.findIndex(l => l.includes('Debug:'));
              if (debugStart >= 0 && smokeStart >= 0) {
                const debugLines = lines.slice(debugStart, smokeStart).join('\n');
                body += '### Debug Output\n```\n' + debugLines.slice(0, 5000) + '\n```\n';
              }
            } catch(e) { body += 'No full output log found: ' + e.message + '\n\n'; }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 65000)
            });

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: tests/e2e/logs/

  publish-docker-image:
    needs: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: determine version
        run: |
          VERSION=$(cat VERSION | tr -d ' \t\n\r')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        if: contains('refs/heads/main', github.ref) || contains('refs/heads/dev', github.ref)
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push dev
        if: contains('refs/heads/dev', github.ref)
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          push: ${{ contains('refs/heads/main', github.ref) }}
          tags: ${{ vars.DOCKER_HUB_USERNAME }}/backup:dev
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push main
        if: contains('refs/heads/main', github.ref)
        uses: docker/build-push-action@v6
        with:
         context: ./docker
         push: true
         tags: ${{ vars.DOCKER_HUB_USERNAME }}/backup:latest, ${{ vars.DOCKER_HUB_USERNAME }}/backup:${{ env.VERSION }}
         platforms: linux/amd64,linux/arm/v7,linux/arm64
         cache-from: type=gha
         cache-to: type=gha,mode=max

  publish-dockerhub-description:
    if: contains('refs/heads/main', github.ref)
    needs:
      - publish-docker-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Dockerhub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          repository: ${{ vars.DOCKER_HUB_USERNAME }}/backup
          readme-filepath: ./README.md
